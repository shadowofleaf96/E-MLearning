<!DOCTYPE html><html class="light" lang="en"><head>

<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap');
    </style>
</head>
<body class="bg-surface-bg text-on-surface min-h-screen flex flex-col font-body-md selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- TopNavBar (Transactional Intent: Navigation suppressed, only logo/support shown) -->
<header class="bg-surface-bg border-b border-border-subtle w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary fill">menu_book</span>
<span class="font-headline-md text-headline-md font-bold text-on-surface">Lumina Learning</span>
</div>
<div>
<a class="font-body-md text-body-md text-secondary hover:text-secondary-fixed transition-colors" href="#">Contact Support</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto">
<div class="w-full max-w-md bg-surface-card border border-border-subtle rounded-xl p-8 shadow-[0_4px_12px_rgba(15,23,42,0.05)] relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary to-tertiary-fixed-dim"></div>
<!-- Logo & Heading -->
<div class="text-center mb-8">
<div class="w-16 h-16 bg-surface-container-low rounded-lg mx-auto flex items-center justify-center mb-4 border border-border-subtle">
<span class="material-symbols-outlined text-secondary text-[32px] fill">science</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Sign In</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Quantum Systems Research Portal</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface border border-border-subtle rounded-lg text-on-surface placeholder-outline-variant focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="Enter your email" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 bg-surface border border-border-subtle rounded-lg text-on-surface placeholder-outline-variant focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="Enter your password" required="" type="password">
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline-variant hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-secondary border-border-subtle rounded focus:ring-secondary cursor-pointer bg-surface" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors group relative overflow-hidden" type="submit">
<span class="relative z-10 flex items-center gap-2">
                        Sign In
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</span>
</button>
</form>
<!-- Request Access -->
<div class="mt-8 pt-6 border-t border-border-subtle text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-secondary hover:underline transition-all ml-1" href="#">Request access</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-bg w-full py-8 px-margin-mobile md:px-margin-desktop border-t border-border-subtle flex flex-col md:flex-row justify-between items-center gap-4 z-10">
<div class="font-headline-md text-headline-md text-on-surface text-sm">
            © 2024 Lumina Learning. All rights reserved.
        </div>
<nav class="flex flex-wrap gap-4 font-body-sm text-body-sm">
<a class="text-on-surface-variant hover:text-secondary underline transition-all" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-secondary underline transition-all" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-secondary underline transition-all" href="#">Help Center</a>
<a class="text-on-surface-variant hover:text-secondary underline transition-all" href="#">Cookie Settings</a>
</nav>
</footer>
<!-- Scripts -->
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
