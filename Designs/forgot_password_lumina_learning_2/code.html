<body class="bg-surface-bg text-on-surface font-body-md min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopNavBar: Suppressed because this is a transactional/linear screen -->
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-surface-bg to-surface-bg">
<div class="w-full max-w-md bg-surface-card border border-border-subtle rounded-xl p-8 md:p-10 shadow-sm relative overflow-hidden group">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-secondary-fixed-dim to-secondary"></div>
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-3xl opacity-30 pointer-events-none"></div>
<!-- Brand Mark -->
<div class="flex justify-center mb-8">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center transform transition-transform group-hover:scale-105 duration-300">
<span class="material-symbols-outlined text-on-primary text-[28px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg md:text-headline-lg text-on-surface mb-2">Forgot Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email address and we'll send you a link to reset your password.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1.5" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 bg-surface-bg border border-border-subtle rounded-lg text-on-surface focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-colors placeholder-outline-variant font-body-sm text-body-sm" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-secondary bg-secondary hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all active:scale-[0.98]" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Footer Action -->
<div class="mt-8 pt-6 border-t border-border-subtle text-center">
<a class="inline-flex items-center gap-1 font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors group/link" href="#">
<span class="material-symbols-outlined text-[16px] group-hover/link:-translate-x-1 transition-transform">chevron_left</span>
                    Back to Login
                </a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-bg border-t border-border-subtle w-full py-8 px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4 mt-auto">
